name: Deploy Next.js to GCP VM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install

      - name: Build Next.js App
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
        
      - name: Zip build output
        run: zip -r next-build.zip .next

      - name: Copy build to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "next-build.zip"
          target: "~/apps/sg-dataviz"

      - name: Restart Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/apps/sg-dataviz
            
            # Pull the latest source files (package.json, public/, etc)
            git reset --hard
            git pull origin main
            
            # Install production dependencies only
            npm install --omit=dev
            
            # Unzip the pre-built .next folder from GitHub Actions
            unzip -o next-build.zip
            rm next-build.zip
            
            # Restart the app
            pm2 restart "sg-dataviz" || pm2 start "npm run start" --name "sg-dataviz"
            pm2 save
