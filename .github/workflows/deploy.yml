name: Deploy Next.js to GCP VM

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js
        run: npm run build

      - name: Package files
        run: tar -czf deploy.tar.gz .next public package.json package-lock.json scripts

      - name: Setup SSH and SCP to VM
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Copy the single compressed file natively
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa deploy.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/apps/sg-dataviz/

      - name: Extract and Restart PM2 over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd ~/apps/sg-dataviz
            
            # Extract the files and remove the archive
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            
            npm ci --omit=dev
            
            # Start or restart the app with PM2
            pm2 restart "sg-dataviz" || pm2 start "npm run start" --name "sg-dataviz"
            pm2 save
