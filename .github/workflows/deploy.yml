name: Deploy Next.js to GCP VM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Restart on VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/apps/sg-dataviz
            
            # Remove the old untracked .next folder to prevent git pull from failing
            rm -rf .next
            
            # Pull the pre-built code directly from GitHub
            git reset --hard
            git pull origin main
            
            npm ci --omit=dev
            
            # Start or restart the app with PM2
            pm2 restart "sg-dataviz" || pm2 start "npm run start" --name "sg-dataviz"
            pm2 save
